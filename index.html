<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Montagmorgen 2</title>
<style>
html,body{margin:0;height:100%;background:#161b1a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:absolute;left:0;top:0;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{'use strict';
/* ============================================================
   MONTAGMORGEN 2 – Prototyp Fabrikbau
   1 Konstanten  2 Zustand  3 Welt  4 Logik  5 Bauen  6 Grafik  7 Eingabe
   Logik zeichnet nichts: window.__G.step(sekunden) spult ohne Bild vor.
   ============================================================ */

/* ---------- 1 Konstanten ---------- */
const W=1280,H=800,T=32,MW=80,MH=52,WW=MW*T,WH=MH*T,LS=1.25,PS=2;
const VIEW={x:0,y:46,w:1280,h:680};
const DX=[1,0,-1,0],DY=[0,1,0,-1];
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const BSPD=3,AUTO_CAP=40,ST_CAP=30,ST_R=8*T,N_ITEMS=8000,N_CRATES=260,SAVE_KEY='montagmorgen2-v1';
// Sorten: 0-3 liegen auf der Wiese, 4-7 entstehen in Maschinen
const TY=[{n:'Dosen',val:25,col:'#c9d2d8'},{n:'PET',val:25,col:'#7fc4e8'},{n:'Glas',val:8,col:'#a8712f'},{n:'Leerkästen',val:150,col:'#d14b3c'},
 {n:'Dosenballen',val:450,col:'#e4eaed'},{n:'PET-Ballen',val:300,col:'#8fd0f0'},{n:'Volle Kästen',val:465,col:'#b23a2e'},{n:'Paletten',val:6750,col:'#c9a16a'}];
const RAW=4;
const BT={
 belt:{name:'Band',cost:50,w:1,h:1,info:['Trägt 3 Stück/s.','Ziehen legt eine Strecke.']},
 split:{name:'Verteiler',cost:300,w:1,h:1,info:['Verteilt reihum auf alle','Bänder, die wegführen.']},
 sort:{name:'Sortierer',cost:500,w:1,h:1,info:['Wirft seine Sorte in','Pfeilrichtung aus, der','Rest läuft weiter. Ist der','Auswurf voll, läuft auch','die Sorte weiter.']},
 station:{name:'Sammelstation',cost:1500,w:2,h:2,info:['Sammler räumen den','Umkreis leer und geben','bis 3 Stück/s aufs Band.']},
 pd:{name:'Dosenpresse',cost:4000,w:2,h:2,inp:{0:12},out:4,time:6,col:'#7d8a93'},
 pp:{name:'PET-Presse',cost:4000,w:2,h:2,inp:{1:8},out:5,time:8,col:'#3f86b8'},
 kp:{name:'Kistenpacker',cost:6000,w:2,h:2,inp:{2:20,3:1},out:6,time:10,col:'#a8553a'},
 pal:{name:'Palettierer',cost:15000,w:2,h:2,inp:{4:8,5:3},out:7,time:24,col:'#c98a2a'},
 auto:{name:'Leergutannahme',w:2,h:3}
};
const TOOLS=['walk','belt','split','sort','station','pd','pp','kp','pal','demo','rot'];
const UPS=[
 {k:'bag',name:'Größere Tüte',base:400,g:1.6,max:6,sub:l=>'fasst '+(25+10*l)},
 {k:'shoe',name:'Laufschuhe',base:500,g:1.6,max:5,sub:l=>'Tempo '+(110+18*l)},
 {k:'auto',name:'Annahme schneller',base:500,g:1.6,max:8,sub:l=>(1.5+l).toFixed(1).replace('.',',')+' Stück/s'},
 {k:'crew',name:'Mehr Sammler',base:3000,g:2,max:3,sub:l=>(3+l)+' je Station'}
];
const upPrice=u=>Math.round(u.base*Math.pow(u.g,st.up[u.k])/10)*10;
const euro=c=>(c/100).toFixed(2).replace('.',',')+' €';
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 2 Zustand ---------- */
let st,grid,belts,blds,items,cells,blocked,camps,foot,AUTO;
let tool='walk',rot=0,sel=null,topoDirty=true,mmT=0,resetArm=0;
const cam={x:300,y:WH/2,z:1,follow:true};
function newState(){return{money:0,earned:0,t:0,done:false,up:{bag:0,shoe:0,auto:0,crew:0},left:[0,0,0,0],total:0,sold:[0,0,0,0,0,0,0,0],
  player:{x:5*T,y:26.5*T,tx:5*T,ty:26.5*T,bag:[],cool:0,ucool:0,ph:0,dir:0,walk:false},fly:[],pops:[],hint:0,lastMsg:-9}}

/* ---------- 3 Welt ---------- */
const PYS=[WH*0.27,WH*0.74],PXS=[WW*0.22,WW*0.52,WW*0.83];
const pathY=(k,x)=>PYS[k]+26*Math.sin(x/160+k*2),pathX=(k,y)=>PXS[k]+20*Math.sin(y/90+k);
function pathDist(x,y){let d=1e9;for(let k=0;k<2;k++)d=Math.min(d,Math.abs(y-pathY(k,x)));for(let k=0;k<3;k++)d=Math.min(d,Math.abs(x-pathX(k,y)));return d}
const inYard=(x,y)=>x<9.5*T&&y>21.5*T&&y<31.5*T;
function genWorld(){
  const r=rng(11);camps=[];foot=[];let tries=0;
  const HUES=['#d9482b','#2f7fc1','#e2a21d','#4d9b54','#7b4fa8','#d8d2c0','#1f9c9c','#e06a9a'];
  while(camps.length<105&&tries++<40000){
    const x=80+r()*(WW-160),y=70+r()*(WH-140);
    if(pathDist(x,y)<56||inYard(x-70,y)||inYard(x,y))continue;
    if(camps.some(c=>Math.hypot(c.x-x,c.y-y)<150))continue;
    const c={x,y,objs:[]},nt=1+(r()*2.4|0);
    for(let k=0;k<nt;k++){const a=r()*6.28,d=k?34+r()*12:0;
      const o={t:'tent',x:x+Math.cos(a)*d*1.3,y:y+Math.sin(a)*d*0.8,col:HUES[r()*HUES.length|0],s:0.85+r()*0.3,flip:r()<0.5};
      c.objs.push(o);foot.push({x:o.x,y:o.y-7*o.s,r:25*o.s})}
    if(r()<0.5){const a=r()*6.28,o={t:'pav',x:x+Math.cos(a)*52,y:y+Math.sin(a)*34,col:r()<0.5?'#f1efe6':'#3c78b4'};c.objs.push(o);foot.push({x:o.x,y:o.y-8,r:24})}
    const nc=1+(r()*3|0);for(let k=0;k<nc;k++){const a=r()*6.28;c.objs.push({t:'chair',x:x+Math.cos(a)*(40+r()*18),y:y+Math.sin(a)*(26+r()*12),col:HUES[r()*HUES.length|0],flip:r()<0.5})}
    if(r()<0.45){const a=r()*6.28;c.objs.push({t:'grill',x:x+Math.cos(a)*50,y:y+Math.sin(a)*32})}
    if(r()<0.4){const a=r()*6.28;c.objs.push({t:'fire',x:x+Math.cos(a)*58,y:y+Math.sin(a)*36})}
    camps.push(c)}
  blocked=new Uint8Array(MW*MH);
  for(const f of foot){const x0=Math.max(0,((f.x-f.r)/T)|0),x1=Math.min(MW-1,((f.x+f.r)/T)|0),y0=Math.max(0,((f.y-f.r)/T)|0),y1=Math.min(MH-1,((f.y+f.r)/T)|0);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(Math.hypot(tx*T+16-f.x,(ty*T+16-f.y)*1.2)<f.r*0.95)blocked[ty*MW+tx]=1}
  items=[];cells=[];for(let i=0;i<MW*MH;i++)cells.push([]);
  const gauss=()=>(r()+r()+r()-1.5)/1.5;let guard=0;const NT=N_ITEMS+N_CRATES;
  while(items.length<NT&&guard++<NT*40){
    let x,y;const crate=items.length>=N_ITEMS,mode=crate?0:r();
    if(mode<0.66){const c=camps[r()*camps.length|0],a=r()*6.28,d=26+Math.abs(gauss())*(crate?30:52);x=c.x+Math.cos(a)*d*1.3;y=c.y+Math.sin(a)*d*0.85}
    else if(mode<0.84){if(r()<0.5){x=r()*WW;y=pathY(r()*2|0,x)+gauss()*28}else{y=r()*WH;x=pathX(r()*3|0,y)+gauss()*28}}
    else{x=r()*WW;y=r()*WH}
    if(x<10||y<12||x>WW-10||y>WH-10||inYard(x,y))continue;
    if(foot.some(f=>Math.hypot(f.x-x,(f.y-y)*1.35)<f.r))continue;
    const t=r(),m=crate?3:t<0.45?0:t<0.75?1:2;
    const it={i:items.length,x,y,m,v:r()*4|0,rot:r()*12|0,alive:true,claimed:false,c:((y/T)|0)*MW+((x/T)|0)};
    items.push(it);cells[it.c].push(it)}
  st.left=[0,0,0,0];items.forEach(it=>st.left[it.m]++);st.total=items.length;
  grid=new Array(MW*MH).fill(null);belts=[];blds=[];
  AUTO={k:'auto',x:1,y:25,w:2,h:3,q:[],acc:0,spin:0,bon:0,rr:0};placeB(AUTO);
}
function near(x,y,R,fn){const x0=Math.max(0,((x-R)/T)|0),x1=Math.min(MW-1,((x+R)/T)|0),y0=Math.max(0,((y-R)/T)|0),y1=Math.min(MH-1,((y+R)/T)|0);
  for(let gy=y0;gy<=y1;gy++)for(let gx=x0;gx<=x1;gx++){const c=cells[gy*MW+gx];for(let k=c.length-1;k>=0;k--){const it=c[k];if(Math.hypot(it.x-x,it.y-y)<=R)fn(it)}}}
function nearestIn(px,py,cx,cy,R){let best=null,bd=1e9;near(cx,cy,R,it=>{if(it.claimed)return;const d=Math.hypot(it.x-px,it.y-py);if(d<bd){bd=d;best=it}});return best}
function removeItem(it){if(!it.alive)return;it.alive=false;const c=cells[it.c];c.splice(c.indexOf(it),1);st.left[it.m]--;eraseItem(it)}

/* ---------- 4 Logik ---------- */
function pop(x,y,txt,col,big){st.pops.push({x,y,txt,col:col||'#ffe27a',t:0,big:!!big})}
function msg(txt){if(st.t-st.lastMsg>1){st.lastMsg=st.t;st.pops.push({x:st.player.x,y:st.player.y-34,txt,col:'#ff9a7a',t:0})}}
function pay(c,x,y,col,big){st.money+=c;st.earned+=c;if(x!=null)pop(x,y,'+'+euro(c),col,big)}
function fly(ty,x0,y0,x1,y1,d){st.fly.push({ty,x0,y0,x1,y1,t:0,d:d||0.3,rot:Math.random()*6.28})}
// Ein Stueck kommt in Fahrtrichtung dir auf Feld x,y an
function tryPush(x,y,ty,dir){if(x<0||y<0||x>=MW||y>=MH)return false;const o=grid[y*MW+x];if(!o)return false;
  if(o.k==='belt'){if(o.item>=0||o.dir===(dir+2)%4)return false;o.item=ty;o.prog=0;o.from=dir;return true}
  return accept(o,ty,dir)}
function accept(b,ty,dir){
  if(b.k==='auto'){if(ty>=RAW){st.sold[ty]++;pay(TY[ty].val,b.x*T+50,b.y*T+20,'#ffd23e',true);return true}if(b.q.length<AUTO_CAP){b.q.push(ty);return true}return false}
  if(b.k==='split'||b.k==='sort'){if(b.item>=0)return false;b.item=ty;b.wait=0.15;b.from=dir;return true}
  const R=BT[b.k].inp;if(R&&R[ty]!=null&&b.buf[ty]<R[ty]*2){b.buf[ty]++;return true}return false}
// Ausgang = angrenzendes Band, das vom Gebaeude wegfuehrt
function pushOut(b,ty,ex){const c=[],pass=b.k==='split'||b.k==='sort';
  for(let d=0;d<4;d++){if(d===ex)continue;const n=d%2?b.w:b.h;for(let k=0;k<n;k++){const x=d===0?b.x+b.w:d===2?b.x-1:b.x+k,y=d===1?b.y+b.h:d===3?b.y-1:b.y+k;
    if(x<0||y<0||x>=MW||y>=MH)continue;const o=grid[y*MW+x];if(o&&((o.k==='belt'&&o.dir===d)||(pass&&(o.k==='split'||o.k==='sort')&&d!==(b.from+2)%4)))c.push(x,y,d)}}
  const n=c.length/3;for(let i=0;i<n;i++){const j=((b.rr+i)%n)*3;if(tryPush(c[j],c[j+1],ty,c[j+2])){b.rr=(b.rr+i+1)%n;return true}}return false}
function updBelts(dt){for(const t of belts){if(t.item<0)continue;if(t.prog<1)t.prog=Math.min(1,t.prog+BSPD*dt);
  if(t.prog>=1&&tryPush(t.x+DX[t.dir],t.y+DY[t.dir],t.item,t.dir))t.item=-1}}
function updBld(b,dt){
  if(b.k==='split'||b.k==='sort'){if(b.item<0)return;b.wait-=dt;if(b.wait>0)return;
    if(b.k==='sort'&&b.item===b.filter){if(tryPush(b.x+DX[b.dir],b.y+DY[b.dir],b.item,b.dir))b.item=-1;else if(b.wait<-0.5&&pushOut(b,b.item,b.dir))b.item=-1}
    else if(pushOut(b,b.item,b.k==='sort'?b.dir:-1))b.item=-1;return}
  if(b.k==='station'){updStation(b,dt);return}
  if(b.k==='auto'){b.acc+=(1.5+st.up.auto)*dt;if(b.bon>0)b.bon-=dt;
    if(b.q.length){b.spin+=dt*9;while(b.acc>=1&&b.q.length){const m=b.q.shift();b.acc-=1;b.bon=0.5;st.sold[m]++;pay(TY[m].val,b.x*T+40+Math.random()*24,b.y*T+34,'#e9eef0')}}else b.acc=Math.min(b.acc,1);return}
  const R=BT[b.k];
  if(b.t<0){if(b.out<2){let ok=true;for(const k in R.inp)if(b.buf[k]<R.inp[k])ok=false;if(ok){for(const k in R.inp)b.buf[k]-=R.inp[k];b.t=0}}}
  else{b.t+=dt;b.anim+=dt;if(b.t>=R.time){b.t=-1;b.out++;b.made++}}
  if(b.out>0&&pushOut(b,R.out,-1))b.out--}
function mkHelper(b){const cx=(b.x+1)*T,cy=(b.y+1)*T;return{x:cx+20,y:cy+26,wx:cx,wy:cy+30,state:'seek',load:[],target:null,cool:0,ph:Math.random()*6,dir:0,walk:false}}
function updStation(b,dt){const cx=(b.x+1)*T,cy=(b.y+1)*T,want=3+st.up.crew;while(b.helpers.length<want)b.helpers.push(mkHelper(b));
  b.cool-=dt;if(b.buf.length&&b.cool<=0&&pushOut(b,b.buf[b.buf.length-1],-1)){b.buf.pop();b.cool=1/3}
  let idle=0;for(const h of b.helpers){updHelper(h,b,cx,cy,dt);if(h.state==='idle')idle++}
  b.empty=idle===b.helpers.length}
function updHelper(h,b,cx,cy,dt){const cap=10,sp=85;h.walk=false;
  const go=(tx,ty,stop)=>{const dx=tx-h.x,dy=ty-h.y,d=Math.hypot(dx,dy);if(d<=stop)return true;const s=Math.min(d-stop,sp*dt);h.x+=dx/d*s;h.y+=dy/d*s;h.dir=Math.atan2(dy,dx);h.walk=true;h.ph+=dt*11;return d-s<=stop+0.01};
  if(h.state==='seek'){if(h.load.length>=cap)h.state='return';else{const it=nearestIn(h.x,h.y,cx,cy,ST_R);
      if(it){it.claimed=true;h.target=it;h.state='walk'}else h.state=h.load.length?'return':'idle'}}
  else if(h.state==='walk'){const it=h.target;if(!it.alive)h.state='seek';else if(go(it.x,it.y,13)){h.state='pick';h.cool=0.2}}
  else if(h.state==='pick'){h.cool-=dt;if(h.cool<=0){const it=h.target;if(it.alive){removeItem(it);h.load.push(it.m);fly(it.m,it.x,it.y,h.wx,h.wy-4,0.2)}h.target=null;h.state='seek'}}
  else if(h.state==='return'){if(go(cx+8,cy+38,3)){h.state='unload';h.cool=0.1}}
  else if(h.state==='unload'){h.cool-=dt;if(h.cool<=0){if(!h.load.length)h.state='seek';else if(b.buf.length<ST_CAP){const m=h.load.pop();b.buf.push(m);fly(m,h.wx,h.wy-4,cx,cy-6,0.25);h.cool=0.08}else h.cool=0.3}}
  else{h.idleT=(h.idleT||0)+dt;if(h.idleT>2){h.idleT=0;h.state='seek'}else go(cx-26+(h.ph%4)*16,cy+44,4)}
  const dx=h.x-h.wx,dy=h.y-h.wy,d=Math.hypot(dx,dy);if(d>21){const k=(d-21)/d;h.wx+=dx*k;h.wy+=dy*k}}
function updPlayer(dt){const p=st.player,sp=110+18*st.up.shoe,cap=25+10*st.up.bag,dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);p.walk=false;
  if(d>3){const s=Math.min(d,sp*dt);p.x+=dx/d*s;p.y+=dy/d*s;p.dir=Math.atan2(dy,dx);p.walk=true;p.ph+=dt*12}
  p.cool-=dt;if(p.cool<=0&&p.bag.length<cap){let best=null,bd=1e9;near(p.x,p.y,28,it=>{const q=Math.hypot(it.x-p.x,it.y-p.y);if(q<bd){bd=q;best=it}});
    if(best){removeItem(best);p.bag.push(best.m);fly(best.m,best.x,best.y,p.x,p.y-12,0.18);p.cool=0.085}}
  else if(p.cool<=0&&p.bag.length>=cap){let any=false;near(p.x,p.y,28,()=>{any=true});if(any)msg('Tüte voll')}
  p.ucool-=dt;if(p.ucool<=0&&p.bag.length){const ax=(AUTO.x+1)*T,ay=(AUTO.y+1.5)*T;
    if(Math.hypot(p.x-ax,p.y-ay)<88){if(AUTO.q.length<AUTO_CAP){const m=p.bag.pop();AUTO.q.push(m);fly(m,p.x,p.y-12,ax,ay-10,0.3);p.ucool=0.07}}
    else for(const b of blds){if(b.k!=='station')continue;const cx=(b.x+1)*T,cy=(b.y+1)*T;if(Math.hypot(p.x-cx,p.y-cy)<62&&b.buf.length<ST_CAP){const m=p.bag.pop();b.buf.push(m);fly(m,p.x,p.y-12,cx,cy-6,0.25);p.ucool=0.07;break}}}}
function update(dt){if(st.done)return;st.t+=dt;updBelts(dt);for(const b of blds)updBld(b,dt);updPlayer(dt);
  for(let k=st.fly.length-1;k>=0;k--){st.fly[k].t+=dt;if(st.fly[k].t>=st.fly[k].d)st.fly.splice(k,1)}
  for(let k=st.pops.length-1;k>=0;k--){st.pops[k].t+=dt;if(st.pops[k].t>1.3)st.pops.splice(k,1)}
  if(resetArm>0)resetArm-=dt;
  const hasSt=blds.some(b=>b.k==='station'),hasM=blds.some(b=>BT[b.k].inp);
  if(st.hint===0&&st.earned>=600)st.hint=1;if(st.hint===1&&hasSt)st.hint=2;if(st.hint===2&&st.earned>=4000)st.hint=3;if(st.hint===3&&hasM)st.hint=4;
  if(st.left[0]+st.left[1]+st.left[2]+st.left[3]===0&&!st.player.bag.length&&!AUTO.q.length&&belts.every(t=>t.item<0)&&blds.every(b=>b.k!=='station'||(!b.buf.length&&b.helpers.every(h=>!h.load.length))))st.done=true}

/* ---------- 5 Bauen ---------- */
function price(k){if(k==='station')return Math.round(1500*Math.pow(1.12,blds.filter(b=>b.k==='station').length)/10)*10;return BT[k].cost}
function freeTile(x,y){if(x<0||y<0||x>=MW||y>=MH)return false;const i=y*MW+x;return!grid[i]&&!blocked[i]&&!cells[i].length}
function canBuild(x,y,w,h){for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(!freeTile(x+i,y+j))return false;return true}
function placeB(b){for(let j=0;j<b.h;j++)for(let i=0;i<b.w;i++)grid[(b.y+j)*MW+b.x+i]=b;blds.push(b);topoDirty=true}
function mkB(k,x,y,paid){const D=BT[k],b={k,x,y,w:D.w,h:D.h,paid,rr:0};
  if(k==='split'||k==='sort'){b.item=-1;b.wait=0;b.dir=rot;b.filter=0;b.from=0}
  else if(k==='station'){b.buf=[];b.cool=0;b.helpers=[];b.empty=false}
  else{b.buf={};for(const t in D.inp)b.buf[t]=0;b.out=0;b.t=-1;b.anim=0;b.made=0}
  return b}
function build(k,x,y){const D=BT[k],p=price(k);if(!canBuild(x,y,D.w,D.h)){msg(blockReason(x,y,D.w,D.h));return null}if(st.money<p){msg('Zu wenig Geld');return null}
  st.money-=p;const b=mkB(k,x,y,p);placeB(b);return b}
function blockReason(x,y,w,h){for(let j=0;j<h;j++)for(let i=0;i<w;i++){const X=x+i,Y=y+j;if(X<0||Y<0||X>=MW||Y>=MH)return'Außerhalb';const q=Y*MW+X;if(grid[q])return'Belegt';if(blocked[q])return'Hier steht ein Zelt';if(cells[q].length)return'Erst sauber machen'}return''}

function start(fresh){st=newState();itemG=null;tool='walk';sel=null;genWorld();if(!fresh)load();cam.x=st.player.x+200;cam.y=st.player.y;cam.follow=true;resize();if(!spr.length)buildSprites();if(!groundL)buildGround();buildItemLayer();buildMini();topoDirty=true}
let last=0,saveT=0;function frame(t){const dt=Math.min(0.05,(t-last)/1000||0);last=t;
  const pv=260*dt/cam.z;if(keys.a||keys.arrowleft){cam.x-=pv;cam.follow=false}if(keys.d||keys.arrowright){cam.x+=pv;cam.follow=false}if(keys.w||keys.arrowup){cam.y-=pv;cam.follow=false}if(keys.s||keys.arrowdown){cam.y+=pv;cam.follow=false}
